<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- "mii" (thousands): the number 1000 above three stacks of coins. Drawn for Bibcit. -->
  <text x="100" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54" fill="#1E4FB5">1000</text>
  <defs>
    <g id="coin">
      <ellipse cx="0" cy="8" rx="24" ry="9" fill="#B8860B"/>
      <rect x="-24" y="0" width="48" height="8" fill="#B8860B"/>
      <ellipse cx="0" cy="0" rx="24" ry="9" fill="#F5C542" stroke="#B8860B" stroke-width="2"/>
    </g>
  </defs>
  <!-- left stack -->
  <use href="#coin" x="44" y="170"/><use href="#coin" x="44" y="158"/><use href="#coin" x="44" y="146"/>
  <use href="#coin" x="44" y="134"/>
  <!-- middle stack (tallest) -->
  <use href="#coin" x="100" y="174"/><use href="#coin" x="100" y="162"/><use href="#coin" x="100" y="150"/>
  <use href="#coin" x="100" y="138"/><use href="#coin" x="100" y="126"/><use href="#coin" x="100" y="114"/><use href="#coin" x="100" y="102"/>
  <!-- right stack -->
  <use href="#coin" x="156" y="170"/><use href="#coin" x="156" y="158"/><use href="#coin" x="156" y="146"/>
  <use href="#coin" x="156" y="134"/><use href="#coin" x="156" y="122"/>
</svg>
