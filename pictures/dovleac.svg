<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A plain pumpkin ("dovleac"), no carved face. Drawn for Bibcit. -->
  <defs>
    <radialGradient id="shade" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#E8730C"/>
    </radialGradient>
  </defs>
  <!-- stem and leaf -->
  <path d="M96 58c-2-14 2-26 12-34l8 6c-7 7-9 16-8 28z" fill="#6B8E23" stroke="#4E6B16" stroke-width="3" stroke-linejoin="round"/>
  <path d="M112 44c14-12 32-12 44-2-12 12-30 14-44 2z" fill="#7CB342" stroke="#558B2F" stroke-width="3" stroke-linejoin="round"/>
  <!-- the ribs: outer ones first, the middle one on top -->
  <ellipse cx="58" cy="118" rx="42" ry="58" fill="url(#shade)" stroke="#C85F06" stroke-width="4"/>
  <ellipse cx="142" cy="118" rx="42" ry="58" fill="url(#shade)" stroke="#C85F06" stroke-width="4"/>
  <ellipse cx="78" cy="118" rx="38" ry="62" fill="url(#shade)" stroke="#C85F06" stroke-width="4"/>
  <ellipse cx="122" cy="118" rx="38" ry="62" fill="url(#shade)" stroke="#C85F06" stroke-width="4"/>
  <ellipse cx="100" cy="118" rx="30" ry="64" fill="url(#shade)" stroke="#C85F06" stroke-width="4"/>
  <!-- a soft shine -->
  <ellipse cx="90" cy="88" rx="7" ry="18" fill="#FFFFFF" opacity=".35"/>
</svg>
