<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibcit</title>
  <meta name="description" content="Învață alfabetul românesc">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
  <script>
    // Light or dark mode chosen in Setări, set before the page is drawn (no flash).
    try {
      var t = (JSON.parse(localStorage.getItem('bibcit.settings') || '{}') || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bibcit">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="letters.js"></script>
  <script src="app.js"></script>
</body>
</html>
